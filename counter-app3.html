<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter app</title>
  <link rel="stylesheet" href="app3.css">
</head>

<body>

  <div class="container">
    <h1>COUNTER APP</h1>


    <div id="count">0</div>

    <div class="buttons">
      <button class="button" id="decrease"> - </button>
      <button class="button" id="reset"> Reset The Number </button>
      <button class="button" id="increase"> + </button>
    </div>

  </div>


  <script src="app3.js"></script>
</body>

</html>
